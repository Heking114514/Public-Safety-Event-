waypoint_navigator:
  ros__parameters:
    route_file: ""
    route_frame: "map"
    # /odometry/fused must carry the explicit map -> base_link frame pair;
    # navigation has no TF conversion fallback for ambiguous frame names.
    odom_child_frame: "base_link"
    route_input_topic: "/waypoint_navigation/route_input"
    start_topic: "/waypoint_navigation/start"

    odom_topic: "/odometry/fused"
    # Consume the fusion gate's bias-corrected/base_link yaw rate. The raw
    # filtered IMU is used only as the gate input and must not drive control.
    imu_topic: "/imu/control"
    # The default tracking point comes from vehicle_physical.yaml. Launch
    # arguments may temporarily override it for controlled A/B checks.
    fusion_status_topic: "/odometry/fusion_status"
    actuator_health_topic: "/cup_car_serial/actuator_healthy"
    # Used only to confirm that both wheels stopped; it is not fused into pose.
    control_telemetry_topic: "/cup_car_serial/control_telemetry"
    front_obstacle_topic: "/obstacle/front_blocked"
    front_obstacle_range_topic: "/obstacle/front_range"
    tracking_state_topic: "/tracking_state"
    cmd_vel_topic: "/cmd_vel_nav"
    path_topic: "/waypoint_path"
    status_topic: "/waypoint_navigation/status"
    current_waypoint_topic: "/waypoint_navigation/current_waypoint"
    motion_hold_state_topic: "/waypoint_navigation/motion_hold_state"
    route_ack_topic: "/waypoint_navigation/route_ack"
    navigation_recovery_state_topic: "/waypoint_navigation/navigation_recovery_state"

    control_frequency: 30.0
    default_speed: 0.05
    max_linear_speed: 0.05
    min_linear_command_speed: 0.035
    rfid_scan_speed: 0.035
    rfid_scan_max_distance_m: 0.20
    max_angular_speed: 0.75
    # The instantaneous limit is also constrained by max_lateral_acceleration.
    # This higher ceiling lets a slow, planned corner turn decisively without
    # forcing a high-speed curve to cut inside its safety envelope.
    max_path_angular_speed: 0.65
    min_path_angular_speed: 0.12
    path_angular_activation_error: 0.05
    path_yaw_response_threshold: 0.04
    max_linear_acceleration: 0.25
    max_linear_deceleration: 0.80
    # Physical stopping model used to keep the 0.05 m/s HTML approach speed without
    # carrying residual forward velocity into a waypoint turn.
    effective_braking_deceleration: 0.35
    braking_control_delay: 0.20
    braking_safety_margin: 0.025
    braking_distance_feedback_gain: 1.00
    max_angular_acceleration: 1.80
    max_angular_deceleration: 3.00
    linear_gain: 0.80
    angular_gain: 1.40
    path_pid_kp: 1.20
    path_pid_ki: 0.08
    path_pid_kd: 0.00
    path_yaw_rate_damping: 0.45
    turn_yaw_rate_damping: 1.00
    # Keep waypoint pivots above the low-speed drivetrain response gap seen in
    # the latest bag, while staying within the configured angular limit.
    turn_cruise_speed: 0.75
    # ALIGN_PATH and final-yaw control always publish exactly zero linear speed.
    # A small position correction can make the MCU leave its pivot controller.
    cross_track_gain: 1.00
    stanley_softening_speed: 0.25
    max_cross_track_correction: 0.30
    cross_track_slowdown_start: 0.015
    # The planner reserves 5 cm for tracking error outside the chassis safety
    # envelope. Slow well before consuming it; straight, centred segments stay
    # at 0.05 m/s.
    cross_track_slowdown_full: 0.04
    cross_track_minimum_speed: 0.04
    # Limit speed from generated-path curvature, so the rectangular vehicle
    # does not cut inside a planned corner while the controller is catching up.
    max_lateral_acceleration: 0.22
    # Track the planned arc proactively; PID remains responsible for residual
    # heading and cross-track error.
    path_curvature_feedforward_gain: 1.00
    # Stop-required junctions are handled by brake + pivot. Keep incoming lane
    # tracking corrections small so braking cannot become an early corner.
    pre_turn_path_angular_ratio: 1.20
    path_pid_integral_limit: 0.20
    rotate_in_place_threshold: 0.18
    rotate_in_place_exit_threshold: 0.09
    precision_turn_threshold: 0.45
    turn_settle_yaw_rate: 0.15
    turn_settle_dwell: 0.20
    min_precision_turn_speed: 0.50
    waypoint_tolerance: 0.04
    waypoint_pass_longitudinal_tolerance: 0.01
    waypoint_pass_lateral_tolerance: 0.045
    waypoint_recovery_speed: 0.10
    waypoint_recovery_heading_tolerance: 0.12
    waypoint_recovery_max_angular_speed: 0.40
    # Normal junction turns use live odometry feedback: enter past the RFID,
    # chase an exit-lane target, then hand back to ordinary path tracking.
    # Vehicle dimensions and base_link-to-axle offset come from vehicle_physical.yaml.
    corner_shunt_enabled: true
    corner_shunt_road_width_m: 0.20
    corner_shunt_road_margin_m: 0.001
    corner_shunt_road_back_m: 0.60
    corner_shunt_road_forward_m: 0.56
    corner_shunt_stop_s: 0.18
    corner_shunt_check_s: 0.05
    corner_shunt_step_s: 0.20
    corner_shunt_exit_yaw_tolerance_rad: 0.08
    corner_shunt_exit_x_m: -0.0075
    corner_shunt_exit_y_m: 0.1225
    corner_shunt_exit_x_tolerance_m: 0.050
    corner_shunt_exit_y_tolerance_m: 0.015
    corner_shunt_max_turn_angle_rad: 2.20
    corner_shunt_max_s: 60.00
    corner_shunt_prediction_horizon_s: 0.20
    corner_shunt_plan_linear_speed_mps: 0.035
    # Used only by an explicitly planned reverse-arrival recovery maneuver.
    corner_shunt_plan_reverse_speed_mps: -0.035
    corner_shunt_plan_angular_speed_rps: 0.40
    corner_shunt_plan_clearance_m: 0.001
    corner_shunt_entry_base_x_m: -0.050
    corner_shunt_closed_loop_min_speed_mps: 0.035
    corner_shunt_closed_loop_max_angular_speed_rps: 0.65
    corner_shunt_closed_loop_bearing_gain: 2.20
    corner_shunt_closed_loop_final_yaw_gain: 1.00
    corner_shunt_closed_loop_entry_heading_gain: 1.40
    corner_shunt_closed_loop_entry_lateral_gain: 2.00
    corner_shunt_closed_loop_yaw_rate_damping: 0.35
    corner_shunt_closed_loop_yaw_rate_filter_s: 0.08
    corner_shunt_closed_loop_exit_max_angular_speed_rps: 0.12
    # Forward turns use a rolling local reference of up to 0.8 m. It is
    # refreshed from measured pose and does not replace the safety gate.
    corner_shunt_local_trajectory_length_m: 0.80
    corner_shunt_local_trajectory_lookahead_m: 0.08
    corner_shunt_local_trajectory_replan_distance_m: 0.12
    corner_shunt_no_progress_timeout_s: 3.0
    corner_shunt_no_progress_distance_m: 0.003
    corner_shunt_no_progress_yaw_rad: 0.03
    corner_shunt_max_plan_count: 4
    # Reverse trim must clear the drivetrain response floor while keeping the
    # slower wheel engaged during heading correction.
    turn_maneuver_trim_speed_mps: 0.050
    turn_maneuver_trim_search_step_m: 0.020
    turn_maneuver_trim_max_distance_m: 0.20
    turn_maneuver_trim_max_angular_speed_rps: 0.18
    turn_maneuver_trim_min_wheel_speed_ratio: 0.70
    turn_maneuver_preferred_entry_x_m: -0.050
    turn_maneuver_entry_yaw_tolerance_rad: 0.20
    turn_maneuver_trim_reverse_hysteresis_m: 0.015
    turn_maneuver_trim_min_direction_hold_s: 0.30
    turn_maneuver_trim_min_direction_distance_m: 0.010
    turn_maneuver_trim_completion_samples: 3
    turn_maneuver_max_direction_switches: 2
    turn_maneuver_max_safety_recovery_attempts: 1
    # Braking, mission holds and localization waits pause
    # position progress. In-place turns remain safe through the displacement gate.
    path_progress_timeout: 10.0
    path_progress_minimum_advance: 0.05
    path_progress_minimum_actual_displacement: 0.25
    path_progress_max_recovery_attempts: 2
    # Independent low-motion stall check. It only arms while a meaningful
    # forward command is active and is paused during turns, braking and holds.
    path_progress_command_threshold: 0.08
    path_progress_stationary_speed_threshold: 0.02
    path_progress_no_motion_timeout: 3.0
    path_progress_no_motion_displacement: 0.05
    turn_progress_stall_timeout: 8.0
    turn_progress_minimum_error_reduction: 0.08
    turn_progress_base_total_timeout: 12.0
    turn_progress_minimum_expected_yaw_rate: 0.08
    # Bag 20260915T152337 shows real pivot yaw-rate around 0.08-0.10 rad/s,
    # well below the commanded angular speed. Supervision uses this physical
    # estimate so stronger commands do not make the watchdog tighter.
    turn_progress_expected_yaw_rate: 0.08
    turn_progress_max_total_timeout: 60.0
    turn_progress_max_recovery_attempts: 2
    pre_turn_stop_heading_threshold: 0.18
    pre_turn_stop_speed: 0.03
    pre_turn_stop_dwell: 0.10
    stop_motion_window: 0.20
    pre_turn_minimum_stop_time: 0.20
    pre_turn_brake_timeout: 1.00
    # Require distinct MCU frames; a cached or duplicated zero cannot pass.
    pre_turn_stop_telemetry_samples: 2
    # After two zero-command windows, tolerate encoder noise only when both
    # fused translation and fresh IMU rotation confirm that the chassis is still.
    pre_turn_fallback_timeouts: 2
    pre_turn_fallback_pose_speed: 0.08
    # Keep final completion close to the captured point. Fused visual odometry
    # can read a few percent long, so a wide release window becomes early
    # physical stopping on short arena segments.
    final_position_release_tolerance: 0.05
    odom_timeout: 0.40
    # /imu/control preserves the lower-controller measurement stamp. Full
    # system load currently leaves about 0.21 s of serial timestamp age.
    imu_timeout: 0.30
    fusion_status_timeout: 0.60
    actuator_health_timeout: 0.80
    control_telemetry_timeout: 0.30
    # No publisher means no obstacle. Only a fresh true event can stop the car;
    # false or timeout clears an event that has not entered recovery yet.
    front_obstacle_timeout: 0.50
    front_obstacle_classification_wait: 0.10
    # Range may arrive just before Bool because the subscriptions are separate,
    # but samples from an older clear/true cycle must never be reused.
    front_obstacle_pairing_reorder_tolerance: 0.10
    # Sensor and chassis offsets come from vehicle_physical.yaml.
    expected_obstacle_tolerance: 0.05
    obstacle_reverse_speed: 0.10
    obstacle_reverse_angular_gain: 1.20
    obstacle_reverse_yaw_rate_damping: 0.40
    obstacle_reverse_max_angular_speed: 0.30
    obstacle_reverse_max_heading_error: 0.70
    obstacle_breadcrumb_spacing: 0.04
    # Reject a single fusion discontinuity from the reverse breadcrumb trace.
    obstacle_maximum_breadcrumb_step: 0.25
    obstacle_reverse_lookahead: 0.12
    obstacle_reverse_target_tolerance: 0.04
    obstacle_recovery_anchor_tolerance: 0.04
    obstacle_reverse_minimum_progress: 0.03
    obstacle_reverse_no_progress_timeout: 3.0
    obstacle_reverse_attempt_timeout: 30.0
    obstacle_replay_start_yaw_tolerance: 0.03
    obstacle_replay_start_max_yaw_error: 0.70
    obstacle_replay_alignment_gain: 1.20
    obstacle_replay_alignment_max_angular_speed: 0.15
    obstacle_replay_tracking_gain: 1.20
    obstacle_replay_tracking_lateral_gain: 1.50
    obstacle_replay_tracking_yaw_rate_damping: 0.20
    obstacle_replay_tracking_max_angular_speed: 0.30
    obstacle_replay_yaw_tolerance: 0.25
    obstacle_replay_fallback_speed: 0.035
    obstacle_reverse_max_recovery_attempts: 2
    obstacle_maximum_breadcrumbs: 2000
    obstacle_maximum_trace_samples: 12000
    stamp_future_tolerance: 0.20
    require_fusion_status: true
    require_actuator_health: false
    allowed_fusion_states:
      - "FULL"
      - "DEGRADED_DEAD_RECKONING"
      - "DEGRADED_NO_VISION"
      - "DEGRADED_NO_IMU"
      - "DEGRADED_NO_WHEEL"
      - "DEGRADED_VISION_ONLY"
      - "DEGRADED_WHEEL_ONLY"
      - "DEGRADED_VISUAL_REALIGNED"

    # Compatibility with direct ORB odometry; fused odometry does not require it.
    require_tracking_state: false
    abort_on_tracking_loss: false
    autostart: false

    # A fusion FAULT is latched by the navigator and always commands zero
    # velocity until a healthy route restart is requested.
