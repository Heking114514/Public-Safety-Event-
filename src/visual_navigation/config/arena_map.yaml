arena:
  width_m: 3.2
  height_m: 4.4
  resolution_m: 0.05

  # The arena is the union of the main field, upper corridor and start bay.
  free_regions:
    - [0.0, 0.0, 3.2, 3.2]
    - [1.0, 3.2, 2.2, 4.2]
    - [1.5, 4.2, 1.7, 4.4]

  # Rectangles use [minimum_x, minimum_y, maximum_x, maximum_y] in metres.
  # The hatched horizontal tunnel sections in the drawing remain free.
  obstacles:
    - [0.2, 0.2, 1.0, 1.0]
    - [0.2, 1.2, 1.0, 2.0]
    - [0.2, 2.2, 1.0, 3.0]
    - [1.2, 0.2, 2.0, 1.0]
    - [1.2, 1.2, 2.0, 2.0]
    - [1.2, 2.2, 2.0, 3.0]
    - [1.2, 3.2, 2.0, 4.0]
    - [2.2, 0.2, 3.0, 1.0]
    - [2.2, 1.2, 3.0, 2.0]
    - [2.2, 2.2, 3.0, 3.0]

  # This is deliberately small for the current experimental car. Increase it
  # after measuring the competition car; planning fails if a corridor closes.
  inflation_radius_m: 0.05

start:
  position_m: [1.6, 4.3]
  # Initial vehicle direction in arena coordinates. -90 degrees points down
  # from the start bay into the field and becomes +X in the ROS route frame.
  heading_deg: -90.0

# Default numbered targets from the competition drawing, at road centrelines.
tasks:
  "1": [1.1, 4.1]
  "2": [0.1, 3.1]
  "3": [0.1, 2.1]
  "4": [0.1, 1.1]
  "5": [0.1, 0.1]
  "6": [1.1, 0.1]
  "7": [2.1, 0.1]
  "8": [3.1, 0.1]
  "9": [3.1, 1.1]
  "10": [3.1, 2.1]
  "11": [3.1, 3.1]
  "12": [2.1, 4.1]

planning:
  # "shortest" uses exact Held-Karp TSP; "numbered" forces 1 through 12.
  mode: shortest
  allow_diagonal: true
  waypoint_spacing_m: 0.35
  route_speed_mps: 0.50
  waypoint_tolerance_m: 0.06
  task_tolerance_m: 0.08
  task_stop_time_s: 0.50
  astar_animation_batch: 32

# Live GUI monitoring. The tracking offsets must match waypoint_navigation.yaml
# so the displayed vehicle reference point is identical to the controller's.
monitoring:
  enabled: true
  route_frame: map
  odom_topic: /odometry/fused
  fusion_status_topic: /odometry/fusion_status
  navigation_status_topic: /waypoint_navigation/status
  current_waypoint_topic: /waypoint_navigation/current_waypoint
  navigation_path_topic: /waypoint_path
  route_plan_input_topic: /waypoint_navigation/route_plan_input
  actuator_health_topic: /cup_car_serial/connected
  require_actuator_health: true
  activation_timeout_s: 3.0
  fusion_status_timeout_s: 0.60
  actuator_health_timeout_s: 0.80
  odom_timeout_s: 0.50
  tracking_point_offset_x: 0.087
  tracking_point_offset_y: 0.040
  trace_minimum_spacing_m: 0.02
  trace_maximum_points: 5000

output:
  directory: ../routes/arena_generated
  route_csv: arena_route.csv
  map_pgm: arena_map.pgm
  map_yaml: arena_map.yaml
  preview_png: arena_route_preview.png
  report_json: arena_route_report.json
