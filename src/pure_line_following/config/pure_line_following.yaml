pure_line_following:
  ros__parameters:
    image_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    depth_image_topic: /camera/camera/aligned_depth_to_color/image_raw
    cmd_vel_topic: /cmd_vel_line_following
    status_topic: /pure_line_following/status
    debug_image_topic: /pure_line_following/debug_image
    publish_debug_image: true
    require_camera_info: true
    require_depth: false
    image_is_rectified: false
    depth_scale: 0.001
    depth_sync_tolerance_s: 0.12

    min_ground_x_m: 0.12
    max_ground_x_m: 1.25
    max_abs_ground_y_m: 0.70
    ground_grid_resolution_m: 0.01
    control_min_x_m: 0.20
    control_max_x_m: 0.65
    control_reference_x_m: 0.30
    control_max_road_span_m: 0.20
    heading_min_x_m: 0.22
    heading_max_x_m: 0.55
    control_max_abs_y_m: 0.36
    road_width_m: 0.20
    # Nominal map width and chassis width from vehicle_physical.yaml are retained
    # for status and tuning, but pure image following uses visible road support.
    road_edge_margin_m: 0.010
    min_observed_road_width_m: 0.12
    max_drive_lateral_error_m: 0.09
    min_recovery_road_width_m: 0.12
    max_recovery_lateral_error_m: 0.12
    # Positive means the road centre is treated as farther left, so the car
    # corrects left. This compensates the observed stable right drift.
    lateral_error_bias_m: 0.015
    use_depth_projection: true
    depth_min_m: 0.12
    depth_max_m: 1.60
    depth_pixel_stride: 2
    # Reject the 5 cm side boards; keep pixels close to the floor plane.
    depth_max_ground_abs_z_m: 0.035
    depth_min_control_pixels: 24
    depth_min_control_rows: 6
    depth_raster_radius_px: 1
    depth_component_dilate_size: 5
    # Depth may refine straight-road centre, but crossroads are better handled
    # by the RGB trunk logic that deliberately ignores the side branch.
    depth_use_on_junction: false
    # Depth centre can jump several centimetres on the side boards and glossy
    # white road. Only let it replace the RGB ground estimate when it is close
    # enough not to trigger a physical-clearance stop by itself.
    depth_max_rgb_lateral_delta_m: 0.018
    depth_max_accepted_lateral_m: 0.012
    depth_max_accepted_road_width_m: 0.24

    green_excess_threshold: 8.0
    min_green_channel: 25.0
    # Pale green/yellow mats are background context, not white road.
    floor_green_min_ratio: 0.345
    floor_green_min_opponent: 0.035
    floor_green_max_lab_a: 127.0
    white_margin_over_green: 28.0
    min_white_value: 18.0
    max_white_value: 175.0
    max_white_spread: 55.0
    max_white_green_excess: 14.0
    max_white_green_ratio: 0.365
    max_white_green_opponent: 0.090
    min_white_lab_a: 128.0
    ground_close_size: 5
    ground_open_size: 3
    green_open_size: 3
    green_dilate_size: 9
    min_ground_green_fraction: 0.08
    min_component_area: 60
    min_control_pixels: 24
    min_control_rows: 8
    max_center_jump_m: 0.30
    branch_span_m: 0.24
    branch_side_extent_m: 0.12
    heading_branch_exclusion_span_m: 0.22

    max_linear_speed_mps: 0.07
    min_linear_speed_mps: 0.035
    corner_linear_speed_mps: 0.035
    junction_linear_speed_mps: 0.055
    min_confidence: 0.35
    max_angular_speed_rps: 0.55
    lateral_gain: 3.6
    heading_gain: 0.8
    lateral_integral_gain: 1.0
    lateral_integral_limit_m_s: 0.06
    lateral_integral_max_error_m: 0.04
    lateral_integral_max_heading_rad: 0.22
    lateral_integral_leak_per_s: 1.2
    angular_deadband_rps: 0.02
    speed_turn_slowdown: 0.65
    rotate_in_place_angular_threshold_rps: 0.50
    max_angular_acceleration_rps2: 2.0
    max_angular_deceleration_rps2: 4.0
    junction_lateral_deadband_m: 0.025
    junction_lateral_gain_scale: 0.35
    junction_heading_deadband_rad: 0.0
    # Physical clearance is derived from road width, chassis width and margin.
    # Move slowly before that and stop forward motion at the physical limit.
    road_center_slow_error_m: 0.006
    road_center_stop_error_m: 0.013
    pivot_heading_error_rad: 0.32
    heading_ignore_road_width_m: 0.22
    unsafe_recovery_max_angular_speed_rps: 0.35
    recovery_min_confidence: 0.05

    image_timeout_s: 0.50
    invalid_stop_s: 0.40
    # Tolerate one or two camera-frame detection dropouts without an immediate
    # zero command. This is visual-only temporal filtering, not odometry.
    invalid_frame_hold_s: 0.18
    command_rate_hz: 30.0
    enabled: true
    allow_navigation_cmd_vel_topic: false
    reject_shared_cmd_vel: true
    shared_cmd_vel_check_period_s: 0.25
    min_valid_observations_before_motion: 2

    # First visible corner handling. The detector may see a side branch before
    # the chassis reaches the turn. Stay on the current road centre during
    # approach, then switch to branch-centre tracking only near the turn entry.
    corner_turn_enabled: true
    corner_turn_once: true
    corner_turn_direction: auto
    # At the launch-lane T/cross, both side branches can be visible. Prefer
    # left unless an asymmetric corner clearly points right.
    corner_turn_junction_prefer_direction: left
    corner_turn_stable_frames: 3
    # Farther corner evidence is useful for status. It must not pull steering
    # until the visible branch entrance is near the chassis.
    corner_turn_trigger_min_x_m: 0.16
    corner_turn_trigger_max_x_m: 0.50
    # With the camera 54.7 mm ahead of base_link and 130 mm above ground,
    # recorded RGB frames lose the branch mouth before it reaches 0.18 m.
    # Enter the turn while the branch is still measurable near the lookahead.
    corner_turn_entry_x_m: 0.32
    corner_turn_entry_hysteresis_m: 0.035
    corner_turn_min_branch_extent_m: 0.12
    # Crossroad extents flicker by a few centimetres. Require a clear side
    # advantage before overriding the configured junction preference.
    corner_turn_branch_extent_margin_m: 0.070
    corner_turn_min_confidence: 0.35
    # During the corner, bypass the normal visual controller and execute a
    # stop-check-act shunt. The arc command is automatically lifted to at
    # least wheel_track * |angular| / 2 so the inner wheel does not reverse.
    corner_turn_linear_speed_mps: 0.018
    corner_turn_angular_speed_rps: 0.30
    corner_turn_stop_s: 0.18
    corner_turn_min_s: 1.20
    corner_turn_max_s: 7.50
    # This applies only before turn entry. The timed turn limit starts after
    # the branch reaches corner_turn_entry_x_m.
    corner_turn_approach_timeout_s: 12.0
    corner_turn_exit_lateral_error_m: 0.040
    corner_turn_exit_heading_error_rad: 0.22
    corner_turn_exit_stable_frames: 3
    corner_turn_check_s: 0.05
    corner_turn_arc_segment_s: 0.22
    corner_turn_rotate_segment_s: 0.16
    corner_turn_creep_segment_s: 0.16
    corner_turn_reverse_segment_s: 0.18
    corner_turn_entry_distance_m: 0.070
    corner_turn_target_yaw_rad: 1.5708
    corner_turn_exit_yaw_tolerance_rad: 0.20
    corner_turn_road_width_m: 0.20
    corner_turn_road_margin_m: 0.008
    corner_turn_road_back_m: 0.60
    corner_turn_road_forward_m: 0.56
    corner_turn_prediction_horizon_s: 0.24
    corner_turn_prediction_step_s: 0.04
    corner_turn_pose_correction_gain: 0.35
    corner_turn_late_turn_progress: 0.72
    corner_turn_late_linear_speed_mps: 0.018
    corner_turn_late_angular_speed_rps: 0.12
    corner_turn_rotate_angular_speed_rps: 0.20
    corner_turn_creep_linear_speed_mps: 0.010
    corner_turn_reverse_linear_speed_mps: -0.008
    corner_turn_reverse_angular_speed_rps: -0.04
    corner_turn_max_reverse_count: 3
