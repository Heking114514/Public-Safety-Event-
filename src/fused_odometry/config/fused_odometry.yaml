fused_odometry_gate:
  ros__parameters:
    visual_topic: /odom
    raw_visual_topic: /odom/orb_raw
    tracking_topic: /tracking_state
    wheel_topic: /wheel/odom
    imu_topic: /imu/filtered
    fused_topic: /odometry/fused
    command_topic: /cmd_vel_nav
    visual_output_topic: /fusion/input/visual_odom
    wheel_output_topic: /fusion/input/wheel_odom
    imu_output_topic: /fusion/input/imu
    status_topic: /odometry/fusion_status
    diagnostics_topic: /diagnostics

    # The repository does not yet contain a measured base_link-to-camera_link
    # extrinsic. Until it is measured, all gated measurements use camera_link.
    world_frame: map
    base_frame: camera_link
    visual_expected_frame: map
    visual_expected_child_frame: camera_link
    raw_visual_expected_frame: map
    # The wheel node must be launched with base_frame:=camera_link until a
    # measured chassis-camera transform is available. Other frames are rejected.
    wheel_expected_child_frame: camera_link
    imu_expected_frame: camera_link
    publish_tf: true

    visual_timeout_s: 0.40
    tracking_timeout_s: 0.60
    wheel_timeout_s: 0.35
    imu_timeout_s: 0.15
    fused_timeout_s: 0.50
    command_timeout_s: 0.40
    raw_visual_timeout_s: 0.30
    raw_sync_tolerance_s: 0.08
    # Reject optical-frame or otherwise non-planar poses mislabeled as map.
    raw_visual_max_tilt_rad: 0.50
    visual_recovery_samples: 5
    visual_recovery_ramp_s: 0.75
    visual_recovery_initial_covariance_scale: 50.0
    visual_recovery_hard_position_m: 1.50
    visual_recovery_hard_yaw_rad: 1.00

    max_dead_reckoning_time_s: 2.0
    max_dead_reckoning_distance_m: 0.30
    # Pure wheel fallback bridges a short simultaneous camera/IMU outage.
    # Wheel + IMU may continue after this window without waiting for vision.
    max_wheel_only_time_s: 2.0
    max_wheel_only_distance_m: 0.30
    max_wheel_only_speed_mps: 0.30
    max_wheel_speed_mps: 1.5
    max_wheel_yaw_rate_radps: 4.0

    consistency_window_s: 0.75
    robust_min_samples: 5
    wheel_visual_soft_mps: 0.15
    wheel_visual_reject_mps: 0.45
    imu_visual_soft_radps: 0.20
    imu_visual_reject_radps: 0.80
    residual_bad_samples: 3
    residual_recovery_samples: 10
    wheel_imu_yaw_soft_radps: 0.15
    wheel_imu_yaw_reject_radps: 0.45
    wheel_yaw_validation_s: 2.0
    wheel_yaw_backup_s: 2.0

    command_motion_threshold_mps: 0.08
    motion_moving_threshold_mps: 0.04
    motion_stationary_threshold_mps: 0.02
    motion_fault_dwell_s: 0.60
    motion_recovery_dwell_s: 1.00
    angular_stall_command_threshold_radps: 0.30
    angular_stall_stationary_threshold_radps: 0.10
    angular_stall_dwell_s: 0.80
    angular_stall_recovery_dwell_s: 1.00

    visual_fused_position_gate_m: 0.80
    visual_fused_yaw_gate_rad: 0.70
    visual_xy_variance: 0.02
    visual_yaw_variance: 0.04
    wheel_vx_variance: 0.08
    wheel_wz_variance: 0.50
    imu_wz_variance: 0.015

fused_ekf:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    permit_corrected_publication: false
    publish_acceleration: false
    # The gate broadcasts map->camera_link from the validated fused output.
    publish_tf: false
    dynamic_process_noise_covariance: true

    # map is deliberately used as the local continuous world frame because the
    # existing navigator consumes map-frame poses and has no TF pose conversion.
    map_frame: map
    odom_frame: odom
    base_link_frame: camera_link
    world_frame: map

    odom0: /fusion/input/visual_odom
    odom0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 5
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 4.0

    odom1: /fusion/input/wheel_odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 4.0

    imu0: /fusion/input/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 30
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_twist_rejection_threshold: 4.0
