fused_odometry_gate:
  ros__parameters:
    raw_visual_topic: /odometry/visual_raw
    tracking_topic: /tracking_state
    map_change_topic: /orbslam3/map_change
    wheel_topic: /wheel/odom
    imu_topic: /cup_car_serial/bmi088_attitude
    visual_output_topic: /fusion/input/visual_odom
    wheel_output_topic: /fusion/input/wheel_odom
    # Processed BMI088 yaw/yaw-rate used by both EKF and navigation.
    imu_output_topic: /imu/control
    status_topic: /odometry/fusion_status
    diagnostics_topic: /diagnostics

    world_frame: map
    # The sanitized wheel stream contributes only body-forward vx.
    wheel_frame: odom
    base_frame: base_link
    visual_expected_frame: map
    visual_expected_child_frame: base_link
    raw_visual_expected_frame: map
    wheel_expected_frame: odom
    wheel_expected_child_frame: base_link
    imu_expected_frame: base_link
    publish_tf: false

    visual_timeout_s: 0.40
    tracking_timeout_s: 0.60
    wheel_timeout_s: 0.35
    # Serial ATT and encoder stamps carry MCU measurement time. Under full
    # camera+ORB+bag load their observed age is about 0.21 s, so keep the IMU
    # freshness window above that while still rejecting second-scale backlog.
    imu_timeout_s: 0.30
    raw_visual_timeout_s: 0.45
    # Reject optical-frame or otherwise non-planar poses mislabeled as map.
    raw_visual_max_tilt_rad: 0.50
    stamp_future_tolerance_s: 0.20
    # ORB warm-up is a recoverable wait. Only after this bound is exceeded does
    # the gate publish FAULT_INIT_TIMEOUT and allow navigation to latch.
    initialization_timeout_s: 10.0
    map_change_grace_s: 1.00
    visual_recovery_samples: 5
    visual_recovery_ramp_s: 0.75
    visual_recovery_initial_covariance_scale: 50.0

    # The no-vision window covers the measured 0.8 m tunnel. It is still
    # bounded so a permanent camera failure cannot run an entire mission.
    max_dead_reckoning_time_s: 4.0
    max_dead_reckoning_distance_m: 1.0
    # Pure wheel fallback bridges a shorter simultaneous camera/IMU outage.
    max_wheel_only_time_s: 2.0
    max_wheel_only_distance_m: 0.30
    max_wheel_only_speed_mps: 0.30
    # STM32 declares 1.0 m/s as the physical wheel-speed ceiling. Normal
    # navigation is lower still (0.6 m/s per-wheel command limit).
    max_wheel_speed_mps: 1.0
    max_wheel_yaw_rate_radps: 4.0
    max_imu_yaw_rate_radps: 4.0

    consistency_window_s: 0.75
    robust_min_samples: 5
    wheel_visual_soft_mps: 0.15
    wheel_visual_reject_mps: 0.45
    # A wheel moving while raw ORB increments show a stationary chassis is
    # slip/lift, not vehicle translation. This stricter branch is independent
    # of whether the absolute visual pose has passed its recovery gate.
    visual_stationary_speed_mps: 0.025
    stationary_wheel_reject_speed_mps: 0.03
    imu_visual_soft_radps: 0.15
    imu_visual_covariance_cap_radps: 0.80
    residual_bad_samples: 3
    residual_recovery_samples: 10
    wheel_imu_yaw_soft_radps: 0.15
    wheel_imu_yaw_reject_radps: 0.25
    wheel_yaw_validation_min_rate_radps: 0.08
    wheel_yaw_validation_s: 2.0
    wheel_yaw_backup_s: 2.0
    # The current encoders provide useful forward distance but overestimate
    # turns. Keep wheel yaw diagnostic-only until repeated turn calibration.
    fuse_wheel_yaw: false

    motion_moving_threshold_mps: 0.04
    motion_stationary_threshold_mps: 0.02
    motion_fault_dwell_s: 0.60
    motion_recovery_dwell_s: 1.00

    visual_xy_variance: 0.02
    visual_yaw_variance: 0.04
    # Raw ORB frame-to-frame speed is the primary local velocity observation.
    visual_vx_variance: 0.01
    # Wheel vx is low-weight, diagnostic-gated translation. Wheel yaw remains
    # disabled because the current encoder turn scale is not trusted.
    wheel_vx_variance: 0.08
    # Encoder vx is downweighted during observed turns. During an observed
    # in-place turn, publish zero center velocity instead of integrating bias.
    wheel_turn_downweight_start_radps: 0.15
    wheel_turn_full_downweight_radps: 0.60
    wheel_turn_covariance_scale: 100.0
    wheel_in_place_max_linear_speed_mps: 0.10
    wheel_in_place_min_yaw_rate_radps: 0.07
    wheel_wz_variance: 0.50
    # BMI088 ATT is already filtered and bias-corrected by the lower controller.
    imu_wz_variance: 0.0004

fused_ekf:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.35
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    permit_corrected_publication: false
    publish_acceleration: false
    publish_tf: true
    dynamic_process_noise_covariance: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Local odometry intentionally excludes absolute ORB pose. Loop closure
    # updates map->odom in map_odom_correction without moving odom->base_link.
    odom0: /fusion/input/visual_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_twist_rejection_threshold: 100.0

    odom1: /fusion/input/wheel_odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 100.0

    imu0: /imu/control
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 30
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    # The fusion gate has already validated and bounded gyro z. A tight second
    # Mahalanobis gate here rejected real turn acceleration, then accepted it
    # late and caused a one-frame yaw jump. Keep only a very loose sanity gate.
    imu0_twist_rejection_threshold: 100.0

map_odom_correction:
  ros__parameters:
    visual_topic: /fusion/input/visual_odom
    local_topic: /odometry/local
    fusion_status_topic: /odometry/fusion_status
    output_topic: /odometry/fused
    map_change_topic: /orbslam3/map_change
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    # Start-relative map frame: map, odom and base_link coincide at startup,
    # with the car's initial forward direction as +X.
    initial_map_x: 0.0
    initial_map_y: 0.0
    initial_map_yaw: 0.0
    # Deprecated compatibility parameter. Visual corrections are always
    # smoothed before they update map->odom; true no longer bypasses filtering.
    direct_visual_tracking: false
    visual_recovery_gap_s: 0.20
    visual_recovery_time_constant_s: 0.25
    visual_recovery_blend_duration_s: 0.80
    hold_global_xy_during_turn: true
    # The IMU owns short-term angular continuity in odom. ORB supplies the
    # long-term yaw correction through map->odom, exactly like its XY update.
    publish_tf: true
    publish_frequency: 30.0
    # Raw ORB is stable in the latest bag; keep normal fused output close to
    # vision instead of accumulating 8-11cm of local-EKF lag while moving.
    correction_time_constant_s: 0.15
    # Once measured local motion is stationary, remove local-EKF residual motion
    # quickly so /odometry/fused cannot keep sliding while raw ORB is stable.
    stationary_correction_time_constant_s: 0.08
    loop_correction_time_constant_s: 1.25
    map_change_smoothing_window_s: 2.0
    # Pair visual and local poses by measurement time. Interior samples are
    # interpolated; a visual sample briefly ahead of local history is queued.
    synchronization_tolerance_s: 0.12
    local_timeout_s: 0.50
    visual_timeout_s: 0.60
    fusion_status_timeout_s: 0.80
    stationary_max_linear_speed_mps: 0.03
    stationary_max_angular_speed_radps: 0.12
    # ORB can report XY motion during measured in-place 90-degree turns. Hold
    # global XY through the turn, then preserve later visual increments.
    turn_hold_max_linear_speed_mps: 0.03
    turn_hold_max_translation_m: 0.10
    turn_hold_entry_angular_speed_radps: 0.07
    turn_hold_min_angular_speed_radps: 0.02
    # The current chassis reports low, slightly intermittent yaw-rate during
    # pivots. Hold through short measurement gaps, then release before normal
    # lane following can accumulate meaningful forward displacement.
    turn_hold_release_delay_s: 0.30
