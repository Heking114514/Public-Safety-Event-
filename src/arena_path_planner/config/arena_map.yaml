arena:
  # Official diagram coordinates use the lower-left corner of the
  # 3200 x 3200 mm main field as the origin.
  width_m: 3.2
  height_m: 4.4
  # A 20 mm grid represents the narrow-road centre line without rounding it
  # onto either obstacle boundary.
  resolution_m: 0.02
  free_regions:
    - [0.0, 0.0, 3.2, 3.2]
    - [1.0, 3.2, 2.2, 4.2]
    - [1.5, 4.2, 1.7, 4.4]
  # Ten 800 x 800 mm blocks leave the nominal 200 mm roads in the diagram.
  obstacles:
    - [0.2, 0.2, 1.0, 1.0]
    - [0.2, 1.2, 1.0, 2.0]
    - [0.2, 2.2, 1.0, 3.0]
    - [1.2, 0.2, 2.0, 1.0]
    - [1.2, 1.2, 2.0, 2.0]
    - [1.2, 2.2, 2.0, 3.0]
    - [1.2, 3.2, 2.0, 4.0]
    - [2.2, 0.2, 3.0, 1.0]
    - [2.2, 1.2, 3.0, 2.0]
    - [2.2, 2.2, 3.0, 3.0]
  inflation_radius_m: 0.05
  preferred_clearance_m: 0.15
  clearance_cost_weight: 6.0
  # Measured complete envelope. The 143.7 mm overall width includes the wheels;
  # the separately measured differential-drive kinematic track is 124.7 mm.
  vehicle_length_m: 0.1434
  vehicle_width_m: 0.1437
  safety_margin_m: 0.015
  tracking_margin_m: 0.020
  # Small planning reserve beyond the inflated obstacle boundary. Braking and
  # reversing remain controller responsibilities; a large reserve would leave
  # too much of the road uninspected.
  obstacle_stop_buffer_m: 0.05
  # Tight intersections require differential-drive pivot turns. This is an
  # intentional competition setting verified by route tests below.
  allow_in_place_turns: true
  # The launch spur meets the top road at x=1.6, y=4.1. This is a physical
  # junction but not an inspection-graph road endpoint.
  turns_at_junctions_only: true
  turn_junctions:
    - [1.6, 4.1]

start:
  position_m: [1.6, 4.3]
  heading_deg: -90.0

# The diagram has no printed task IDs. These are the project's existing road
# centre visit points and labels, retained so mission APIs remain compatible.
tasks:
  "1": [1.1, 4.1]
  "2": [0.1, 3.1]
  "3": [0.1, 2.1]
  "4": [0.1, 1.1]
  "5": [0.1, 0.1]
  "6": [1.1, 0.1]
  "7": [2.1, 0.1]
  "8": [3.1, 0.1]
  "9": [3.1, 1.1]
  "10": [3.1, 2.1]
  "11": [3.1, 3.1]
  "12": [2.1, 4.1]

# Tunnel checkpoints are the adjacent intersection centres. At these centres
# the complete chassis has cleared the 0.8 m block, and the next leg can make a
# 90 degree turn instead of reversing the extra 5 cm back to the vertical road.
tunnels:
  "TUNNEL_1":
    entry: [1.1, 1.1]
    exit: [2.1, 1.1]
  "TUNNEL_2":
    entry: [1.1, 2.1]
    exit: [2.1, 2.1]
  "TUNNEL_3":
    entry: [1.1, 3.1]
    exit: [2.1, 3.1]
  "TUNNEL_4":
    entry: [1.1, 0.1]
    exit: [2.1, 0.1]

# Road-centre graph used by coverage mode. Every edge must be inspected at
# least once because recognition targets may appear anywhere along a road.
inspection_graph:
  nodes:
    - [0.1, 0.1]
    - [1.1, 0.1]
    - [2.1, 0.1]
    - [3.1, 0.1]
    - [0.1, 1.1]
    - [1.1, 1.1]
    - [2.1, 1.1]
    - [3.1, 1.1]
    - [0.1, 2.1]
    - [1.1, 2.1]
    - [2.1, 2.1]
    - [3.1, 2.1]
    - [0.1, 3.1]
    - [1.1, 3.1]
    - [2.1, 3.1]
    - [3.1, 3.1]
    - [1.1, 4.1]
    - [2.1, 4.1]
  edges:
    # Horizontal roads, including the four mandatory tunnels in the middle.
    - [0, 1, "ROAD_BOTTOM_LEFT", false]
    - [1, 2, "TUNNEL_4", true]
    - [2, 3, "ROAD_BOTTOM_RIGHT", false]
    - [4, 5, "ROAD_Y1_LEFT", false]
    - [5, 6, "TUNNEL_1", true]
    - [6, 7, "ROAD_Y1_RIGHT", false]
    - [8, 9, "ROAD_Y2_LEFT", false]
    - [9, 10, "TUNNEL_2", true]
    - [10, 11, "ROAD_Y2_RIGHT", false]
    - [12, 13, "ROAD_Y3_LEFT", false]
    - [13, 14, "TUNNEL_3", true]
    - [14, 15, "ROAD_Y3_RIGHT", false]
    - [16, 17, "ROAD_TOP", false]
    # Vertical roads.
    - [0, 4, "ROAD_X0_Y0", false]
    - [4, 8, "ROAD_X0_Y1", false]
    - [8, 12, "ROAD_X0_Y2", false]
    - [1, 5, "ROAD_X1_Y0", false]
    - [5, 9, "ROAD_X1_Y1", false]
    - [9, 13, "ROAD_X1_Y2", false]
    - [13, 16, "ROAD_X1_Y3", false]
    - [2, 6, "ROAD_X2_Y0", false]
    - [6, 10, "ROAD_X2_Y1", false]
    - [10, 14, "ROAD_X2_Y2", false]
    - [14, 17, "ROAD_X2_Y3", false]
    - [3, 7, "ROAD_X3_Y0", false]
    - [7, 11, "ROAD_X3_Y1", false]
    - [11, 15, "ROAD_X3_Y2", false]

planning:
  mode: shortest
  task_tolerance_m: 0.08
  waypoint_spacing_m: 0.1
  curve_spacing_m: 0.025
  minimum_turning_radius_m: 0.25
  maximum_heading_step_deg: 8.0
  in_place_turn_heading_threshold_deg: 10.3132

topics:
  service: /arena_path_planner/plan
  arena_path: /arena_path_planner/arena_path
  navigation_path: /arena_path_planner/navigation_path
  occupancy_grid: /arena_path_planner/map
  route_input: /waypoint_navigation/route_input
