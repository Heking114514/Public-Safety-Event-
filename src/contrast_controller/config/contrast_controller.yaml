contrast_controller:
  ros__parameters:
    # 与正式导航共享参数 ABI；本实现所有运动阶段实际使用统一死区速度。
    obstacle_pose_recovery_enabled: true
    recovery_linear_speed: 0.035
    recovery_angular_speed: 0.65
    recovery_primitive_s: 0.45
    recovery_margin_m: 0.002
    recovery_exit_distance_m: 0.18
    recovery_max_radius_m: 0.85
    recovery_max_expansions: 220000
    recovery_progress_timeout_s: 2.0
    recovery_selection_timeout_s: 30.0
    recovery_forward_adjustment_m: 0.08
    recovery_switch_stop_s: 0.22
    # 仅恢复动作使用，正常巡航参数保持当前调试值。
    recovery_turn_angular_speed: 0.40
    recovery_turn_min_angular_speed: 0.40
    recovery_turn_entry_target_x: -0.070
    recovery_turn_entry_target_y: 0.0
    recovery_turn_creep_distance: 0.005
    recovery_turn_entry_tolerance: 0.003
    recovery_stop_speed_mps: 0.002
    recovery_stop_yaw_rate_rps: 0.03
    recovery_stop_timeout_s: 2.0
    turn_maneuver_enabled: true
    turn_maneuver_entry_target_x: -0.070
    turn_maneuver_entry_target_y: 0.0
    turn_maneuver_entry_speed: 0.035
    turn_maneuver_angular_speed: 0.35
    turn_maneuver_min_angular_speed: 0.15
    turn_maneuver_creep_speed: 0.030
    turn_maneuver_turn_linear_speed: 0.035

    # 入口必须同时满足纵向、横向和航向门限。
    turn_maneuver_entry_tolerance: 0.010
    turn_maneuver_entry_lateral_tolerance: 0.010
    turn_maneuver_entry_yaw_tolerance: 0.080
    turn_maneuver_entry_heading_gain: 1.2
    turn_maneuver_entry_lateral_gain: 2.0
    turn_maneuver_entry_max_angular_speed: 0.15
    turn_maneuver_creep_distance: 0.025
    turn_maneuver_exit_lateral_tolerance: 0.045

    # 每个运动阶段分别计时；暂停期间不消耗阶段预算。
    turn_maneuver_phase_timeout: 12.0
    turn_maneuver_no_progress_timeout: 1.5
    turn_maneuver_min_position_progress: 0.003
    turn_maneuver_min_yaw_progress: 0.030
