# Opt-in recording profile for replaying the actual D455 stereo SLAM input.
# Usage: NAVIGATION_RECORDING_CONFIG=config/navigation_recording_slam_benchmark.yaml
#        scripts/start_visual_navigation.sh [usual navigation arguments]
navigation_recording:
  retain_bags: 3
  topics:
    - /camera/camera/infra1/image_rect_raw
    - /camera/camera/infra2/image_rect_raw
    - /camera/camera/infra1/camera_info
    - /camera/camera/infra2/camera_info
    - /camera/camera/imu
    - /odometry/visual_raw
    - /odometry/visual_continuous
    - /odometry/fused
    - /odometry/landmark_corrected
    - /wheel/odom
    - /tracking_state
    - /orbslam3/map_change
    - /diagnostics
    - /parameter_events
    - /rosout
    - /tf
    - /tf_static
