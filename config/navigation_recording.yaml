# Topics needed for localization output, fusion, controller, actuator and
# planner diagnosis. Raw/compressed camera images and point clouds are
# intentionally excluded so a competition run cannot fill the disk with bag
# data. Camera calibration metadata is small and remains recorded.
navigation_recording:
  retain_bags: 3
  topics:
    - /camera/camera/infra1/camera_info
    - /camera/camera/infra2/camera_info
    - /camera/camera/imu
    - /odometry/visual_continuous
    - /odometry/visual_raw
    - /orbslam3/map_change
    - /wheel/odom
    - /odometry/local
    - /odometry/fused
    - /fusion/input/visual_odom
    - /fusion/input/wheel_odom
    - /imu/filtered
    - /imu/control
    - /imu/rpy
    - /tracking_state
    - /odometry/fusion_status
    - /obstacle/front_blocked
    - /obstacle/front_range
    - /cmd_vel_nav
    - /waypoint_path
    - /waypoint_navigation/route_input
    - /arena_path_planner/arena_path
    - /arena_path_planner/navigation_path
    - /arena_path_planner/map
    - /waypoint_navigation/route_ack
    - /waypoint_navigation/status
    - /waypoint_navigation/current_waypoint
    - /waypoint_navigation/motion_hold_state
    - /waypoint_navigation/start
    - /cup_car_serial/encoder_ticks
    - /cup_car_serial/connected
    - /cup_car_serial/actuator_healthy
    - /cup_car_serial/actuator_tracking_status
    - /cup_car_serial/control_telemetry
    - /cup_car_serial/rx
    - /diagnostics
    - /parameter_events
    - /rosout
    - /tf
    - /tf_static
