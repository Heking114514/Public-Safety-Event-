# Topics needed for fusion, controller, actuator and stereo-camera tuning.
# The D455 driver names its actual infrared image feeds image_rect_raw; these
# are also the exact messages consumed by ORB-SLAM3. Duplicate legacy odometry
# aliases and ORB's cumulatively growing /path topic are intentionally omitted.
navigation_recording:
  retain_bags: 3
  topics:
    - /camera/camera/infra1/image_rect_raw
    - /camera/camera/infra1/camera_info
    - /camera/camera/infra2/image_rect_raw
    - /camera/camera/infra2/camera_info
    - /camera/camera/imu
    - /odometry/visual_continuous
    - /odometry/visual_raw
    - /orbslam3/map_change
    - /wheel/odom
    - /odometry/local
    - /odometry/fused
    - /fusion/input/visual_odom
    - /fusion/input/wheel_odom
    - /imu/filtered
    - /imu/control
    - /imu/rpy
    - /tracking_state
    - /odometry/fusion_status
    - /cmd_vel_nav
    - /waypoint_path
    - /waypoint_navigation/route_input
    - /arena_path_planner/arena_path
    - /arena_path_planner/navigation_path
    - /arena_path_planner/map
    - /waypoint_navigation/route_ack
    - /waypoint_navigation/status
    - /waypoint_navigation/current_waypoint
    - /waypoint_navigation/motion_hold_state
    - /waypoint_navigation/start
    - /cup_car_serial/encoder_ticks
    - /cup_car_serial/connected
    - /cup_car_serial/actuator_healthy
    - /cup_car_serial/actuator_tracking_status
    - /cup_car_serial/control_telemetry
    - /cup_car_serial/rx
    - /diagnostics
    - /parameter_events
    - /rosout
    - /tf
    - /tf_static
