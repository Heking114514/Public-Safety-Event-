# Defaults for the unified navigation entry point. Relevant command-line
# options override these values. Navigation mode is intentionally not
# configurable here: no arguments always means GUI mode, while -a/--autostart
# always means scripts/waypoints.csv (or the path below).
navigation_startup:
  serial_device: auto
  serial_baud_rate: 115200
  use_serial: true
  camera_serial: ""
  use_imu: true
  use_slam_imu: false
  # Navigation pose input. Switch this between:
  #   /odometry/local_map - start-aligned local EKF, bypasses visual global correction
  #   /odometry/fused - visual-corrected fused output, kept for comparison
  odom_topic: /odometry/fused
  # RK3588 trial values:
  #   camera_infra_profile: 848x480x15
  #   orb_settings_file: src/orb_slam3/orbslam3_ros2/config/stereo-inertial/RealSense_D455_rk3588.yaml
  #   rmw_implementation: rmw_cyclonedds_cpp
  camera_infra_profile: 848x480x30
  orb_settings_file: ""
  rmw_implementation: ""
  equalize: true
  visualization: false
  build_if_needed: true
  check_camera: true
  force_camera_reset: false
  build_jobs: 2
  default_autostart_route: scripts/waypoints.csv
